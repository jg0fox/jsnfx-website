<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>03 · Z-Travel + Focus</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  #hud {
    position: fixed; left: 16px; bottom: 14px;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: rgba(255,255,255,0.32); pointer-events: none; user-select: none;
    letter-spacing: 0.03em;
  }
  #hud b { color: rgba(255,255,255,0.55); font-weight: 500; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="hud"><b>03 · Z-Travel + Focus</b> — drag to fling · ⌘+scroll to travel · click a star to focus · <span id="fps">–</span></div>
<script>
(() => {
  // ─── Tunables ─────────────────────────────────────────────────────────────
  const CFG = {
    F: 820,            // focal length (px). higher = narrower FOV / less warp
    spacing: 240,      // world Z distance between star sheets
    near: 90,          // nearest render depth
    far: 2800,         // farthest render depth
    fade: 380,         // soft fade band at the near & far edges (kills popping)
    cell: 240,         // world cell size (x/y) within a sheet
    starsPerCell: 0.9, // avg stars per cell per sheet
    sizeSkew: 3.0,     // higher = more tiny stars, fewer big ones
    refDz: 620,        // reference depth: stars here track the finger 1:1

    friction: 0.945,   // x/y fling decay per 60fps-frame
    stopBelow: 0.02,
    velSmoothing: 0.6,

    wheelScale: 1.0,   // trackpad x/y scrub sensitivity
    zSpeed: 1.1,       // ⌘+scroll travel sensitivity (world units / wheel px)

    focusDz: 340,      // depth a focused star settles to (how close it comes)
    focusEase: 0.085,  // camera easing toward a focused star (higher = snappier)
    hitRadius: 28,     // click hit tolerance (px)
  };

  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d', { alpha: false });
  const fpsEl = document.getElementById('fps');
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // camera: x/y in world units, z in world depth (increasing = travelling forward)
  const cam = { x: 0, y: 0, z: 0, vx: 0, vy: 0 };
  const refScale = () => CFG.F / CFG.refDz;

  // ─── Deterministic per-cell PRNG ──────────────────────────────────────────
  function seedFor(cx, cy, cz) {
    let h = (cx * 374761393 + cy * 668265263 + cz * 2246822519) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return (h ^ (h >>> 16)) >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Iterate every visible star, far → near, calling visit() for each.
  // Shared by the renderer and by click hit-testing (single source of truth).
  function project(visit) {
    const cx = W / 2, cy = H / 2;
    const iMin = Math.ceil((cam.z + CFG.near) / CFG.spacing);
    const iMax = Math.floor((cam.z + CFG.far) / CFG.spacing);
    for (let i = iMax; i >= iMin; i--) {          // far sheets first (painter's)
      const dz = i * CFG.spacing - cam.z;
      if (dz < CFG.near || dz > CFG.far) continue;
      const scale = CFG.F / dz;
      const fade = clamp((dz - CFG.near) / CFG.fade, 0, 1) *
                   clamp((CFG.far - dz) / CFG.fade, 0, 1);
      if (fade <= 0) continue;

      const halfW = (W / 2) / scale + CFG.cell;
      const halfH = (H / 2) / scale + CFG.cell;
      const g0x = Math.floor((cam.x - halfW) / CFG.cell);
      const g1x = Math.floor((cam.x + halfW) / CFG.cell);
      const g0y = Math.floor((cam.y - halfH) / CFG.cell);
      const g1y = Math.floor((cam.y + halfH) / CFG.cell);

      for (let gx = g0x; gx <= g1x; gx++) {
        for (let gy = g0y; gy <= g1y; gy++) {
          const rnd = mulberry32(seedFor(gx, gy, i));
          let n = Math.floor(CFG.starsPerCell);
          if (rnd() < CFG.starsPerCell - n) n++;
          for (let k = 0; k < n; k++) {
            const wx = (gx + rnd()) * CFG.cell;
            const wy = (gy + rnd()) * CFG.cell;
            const sx = (wx - cam.x) * scale + cx;
            const sy = (wy - cam.y) * scale + cy;
            const t = Math.pow(rnd(), CFG.sizeSkew);
            const r = clamp((0.35 + t * 1.15) * scale * 0.5, 0.3, 7);
            const a = (0.35 + t * 0.65) * fade;
            if (sx < -10 || sx > W + 10 || sy < -10 || sy > H + 10) continue;
            visit(sx, sy, r, a, wx, wy, i);
          }
        }
      }
    }
  }

  // ─── Focus state ──────────────────────────────────────────────────────────
  let focusing = false;
  const focusT = { x: 0, y: 0, z: 0 };
  let ring = null; // { wx, wy, i, start }

  function focusAt(px, py) {
    let best = null, bestD = CFG.hitRadius;
    project((sx, sy, r, a, wx, wy, i) => {
      const d = Math.hypot(sx - px, sy - py);
      if (d < bestD) { bestD = d; best = { wx, wy, i }; }
    });
    if (!best) return;
    focusT.x = best.wx; focusT.y = best.wy;
    focusT.z = best.i * CFG.spacing - CFG.focusDz;
    focusing = true;
    cam.vx = 0; cam.vy = 0;
    ring = { wx: best.wx, wy: best.wy, i: best.i, start: performance.now() };
  }

  // ─── Render ───────────────────────────────────────────────────────────────
  function draw(now) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    project((sx, sy, r, a) => {
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, 6.2832);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    // focus confirmation ring, pinned to the target star
    if (ring) {
      const dz = ring.i * CFG.spacing - cam.z;
      const e = (now - ring.start) / 700;
      if (e >= 1 || dz < CFG.near) { ring = null; }
      else {
        const scale = CFG.F / dz;
        const sx = (ring.wx - cam.x) * scale + W / 2;
        const sy = (ring.wy - cam.y) * scale + H / 2;
        ctx.strokeStyle = `rgba(255,255,255,${(1 - e) * 0.55})`;
        ctx.lineWidth = 1.25;
        ctx.beginPath();
        ctx.arc(sx, sy, 6 + e * 40, 0, 6.2832);
        ctx.stroke();
      }
    }
  }

  // ─── Input ────────────────────────────────────────────────────────────────
  let dragging = false, lastX = 0, lastY = 0, downX = 0, downY = 0;
  canvas.addEventListener('pointerdown', (e) => {
    dragging = true; focusing = false; canvas.classList.add('dragging');
    cam.vx = 0; cam.vy = 0;
    lastX = e.clientX; lastY = e.clientY; downX = e.clientX; downY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const s = refScale();
    const dx = (e.clientX - lastX) / s, dy = (e.clientY - lastY) / s;
    lastX = e.clientX; lastY = e.clientY;
    cam.x -= dx; cam.y -= dy;
    cam.vx = CFG.velSmoothing * cam.vx + (1 - CFG.velSmoothing) * -dx;
    cam.vy = CFG.velSmoothing * cam.vy + (1 - CFG.velSmoothing) * -dy;
  });
  canvas.addEventListener('pointerup', (e) => {
    dragging = false; canvas.classList.remove('dragging');
    if (Math.hypot(e.clientX - downX, e.clientY - downY) < 5) focusAt(e.clientX, e.clientY);
  });
  canvas.addEventListener('pointercancel', () => {
    dragging = false; canvas.classList.remove('dragging');
  });

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    focusing = false;
    if (e.metaKey || e.ctrlKey) {           // ⌘+scroll (or trackpad pinch) → travel Z
      cam.z -= e.deltaY * CFG.zSpeed;        // up/away = forward into the field
    } else {                                 // plain scroll → pan X/Y
      const s = refScale();
      cam.x += (e.deltaX * CFG.wheelScale) / s;
      cam.y += (e.deltaY * CFG.wheelScale) / s;
      cam.vx = 0; cam.vy = 0;
    }
  }, { passive: false });

  // ─── Loop ─────────────────────────────────────────────────────────────────
  let lastT = performance.now();
  function frame(t) {
    const dt = Math.min((t - lastT) / 16.6667, 3);
    lastT = t;

    if (focusing) {
      cam.x += (focusT.x - cam.x) * CFG.focusEase * dt;
      cam.y += (focusT.y - cam.y) * CFG.focusEase * dt;
      cam.z += (focusT.z - cam.z) * CFG.focusEase * dt;
      if (Math.abs(focusT.x - cam.x) + Math.abs(focusT.y - cam.y) +
          Math.abs(focusT.z - cam.z) < 0.5) {
        cam.x = focusT.x; cam.y = focusT.y; cam.z = focusT.z; focusing = false;
      }
    } else if (!dragging) {
      cam.x += cam.vx * dt; cam.y += cam.vy * dt;
      const decay = Math.pow(CFG.friction, dt);
      cam.vx *= decay; cam.vy *= decay;
      if (Math.abs(cam.vx) < CFG.stopBelow) cam.vx = 0;
      if (Math.abs(cam.vy) < CFG.stopBelow) cam.vy = 0;
    }

    draw(t);

    fpsEl._a = (fpsEl._a || 0) + 1000 / Math.max(t - (fpsEl._p || t), 1);
    fpsEl._n = (fpsEl._n || 0) + 1; fpsEl._p = t;
    if (fpsEl._n >= 30) { fpsEl.textContent = Math.round(fpsEl._a / fpsEl._n) + ' fps'; fpsEl._a = 0; fpsEl._n = 0; }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
