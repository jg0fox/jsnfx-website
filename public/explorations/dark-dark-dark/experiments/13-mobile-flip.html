<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>13 · Mobile Flip</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: ui-sans-serif, -apple-system, system-ui, sans-serif; overscroll-behavior: none; }
  canvas { display: block; touch-action: none; }

  /* ── the flippable frame (spins; stars behind stay put) ── */
  #frame { position: fixed; inset: 0; z-index: 5; transform-origin: center center;
    pointer-events: none; will-change: transform; }
  .face { position: absolute; inset: 0; transform-origin: center center; backface-visibility: hidden; pointer-events: none; }
  .bezel { position: absolute; inset: 12px; border: 1.5px solid rgba(255,255,255,0.16); border-radius: 26px; pointer-events: none; }
  .face--back .bezel { border-color: rgba(150,200,255,0.55); box-shadow: inset 0 0 90px rgba(90,160,230,0.09); }

  /* grip handles — the only thing that starts a flip */
  .grip { position: absolute; width: 52px; height: 52px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px; pointer-events: auto; touch-action: none;
    cursor: grab; z-index: 7; }
  .grip:active { cursor: grabbing; }
  .grip span { display: block; width: 20px; height: 2px; border-radius: 2px; background: rgba(255,255,255,0.5); }
  .grip--tr { top: 14px; right: 14px; }
  .grip--bl { bottom: 14px; left: 14px; }
  .grip small { font: 9px ui-monospace, Menlo, monospace; letter-spacing: .18em; text-transform: uppercase;
    color: rgba(255,255,255,0.4); margin-top: 3px; }

  /* mode chrome, top-center, rides the frame */
  .chrome { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    width: min(93vw, 440px); border-radius: 18px; overflow: hidden; pointer-events: none;
    background: rgba(18,18,24,0.6); border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(16px) saturate(1.2); -webkit-backdrop-filter: blur(16px) saturate(1.2);
    box-shadow: 0 10px 34px rgba(0,0,0,0.5); }
  .chrome .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 15px; pointer-events: auto; }
  .ttl { font-size: 15px; font-weight: 600; color: #fff; font-variant-numeric: tabular-nums; }
  .sub { font-size: 12px; color: rgba(255,255,255,0.45); margin-top: 1px; font-variant-numeric: tabular-nums; }
  .acts { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
  .minibtn { font: 500 12px ui-sans-serif, system-ui; padding: 7px 12px; border-radius: 10px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.16); background: transparent; color: rgba(255,255,255,0.78); }
  .minibtn.primary { border: none; color: #05121f; background: linear-gradient(180deg,#bfe4ff,#8ec8ff); font-weight: 600; }
  .minibtn.primary:disabled { opacity: 0.4; }
  #plist { max-height: 0; overflow-y: auto; transition: max-height .28s ease; padding: 0 15px; -webkit-overflow-scrolling: touch; }
  #sheet.expanded #plist { max-height: 42vh; padding: 2px 15px 14px; border-top: 1px solid rgba(255,255,255,0.08); }
  .pday { padding: 9px 0 4px; } .pdate { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.82); margin-bottom: 7px; }
  .pchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: 11px ui-monospace, Menlo, monospace; color: rgba(180,225,255,0.95);
    background: rgba(90,160,220,0.16); border: 1px solid rgba(140,200,255,0.28); border-radius: 999px; padding: 4px 10px; cursor: pointer; }

  .fhint { position: absolute; left: 50%; bottom: max(30px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    font: 11px ui-monospace, Menlo, monospace; color: rgba(255,255,255,0.4); letter-spacing: .02em;
    white-space: nowrap; pointer-events: none; }

  #toast { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0.96);
    padding: 11px 20px; border-radius: 12px; font-size: 14px; color: #fff; z-index: 9;
    background: rgba(30,40,55,0.9); border: 1px solid rgba(150,200,255,0.3);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div id="frame">
  <!-- FRONT · Browse -->
  <div class="face face--front" data-flip-face="front">
    <div class="bezel"></div>
    <div class="chrome">
      <div class="head">
        <div><div class="ttl" id="bTitle">—</div><div class="sub" id="bSub">—</div></div>
        <div class="acts"><button class="minibtn todayBtn">Today</button></div>
      </div>
    </div>
    <div class="fhint">grab a corner → flip to Select</div>
  </div>
  <!-- BACK · Select -->
  <div class="face face--back" data-flip-face="back">
    <div class="bezel"></div>
    <div class="chrome" id="sheet">
      <div class="head" id="sheetHead">
        <div><div class="ttl" id="selCount">Select times</div><div class="sub" id="selSub">tap a star · drag to lasso</div></div>
        <div class="acts">
          <button class="minibtn todayBtn">Today</button>
          <button class="minibtn primary" id="createBtn" disabled>Create</button>
        </div>
      </div>
      <div id="plist"></div>
    </div>
    <div class="fhint">grab a corner → flip to Browse</div>
  </div>
  <!-- grips (spin the frame) -->
  <div class="grip grip--tr" data-flip-grip="top"><span></span><span></span><span></span><small>flip</small></div>
  <div class="grip grip--bl" data-flip-grip="bottom"><small>flip</small><span></span><span></span><span></span></div>
</div>

<div id="toast"></div>

<script>
(() => {
  // ═══ frame flip (adapted from flip-kit: rotate a full-screen frame, grab only from grips) ═══
  const FLIP_SPRING = { damping: 12, mass: 0.6 }, WOBBLE_SETTLE = { stiffness: 80, damping: 8, mass: 0.5 },
        SNAPBACK_SPRING = { stiffness: 200, damping: 15, mass: 1 }, WOBBLE_SNAP = { stiffness: 150, damping: 12, mass: 1 };
  function createFrameFlip(frame, opts = {}) {
    const o = { rotationDamping: 0.16, maxDragRotation: 60, commitAngle: 30, velocityThreshold: 140, wobbleAmount: 6, onFlip: null, ...opts };
    const faceFront = frame.querySelector('[data-flip-face="front"]'), faceBack = frame.querySelector('[data-flip-face="back"]');
    const grips = [...frame.querySelectorAll('[data-flip-grip]')];
    const reduce = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
    let committed = 0, rotation = 0, wobble = 0, side = 'front';
    let dragging = false, pid = null, fromTop = true, startX = 0, lastX = 0, lastT = 0, vel = 0, rotAnim = null, wobAnim = null;
    render();
    function render() {
      frame.style.transform = `rotate(${rotation}deg)`;
      const showFront = side === 'front';
      faceFront.style.visibility = showFront ? 'visible' : 'hidden';
      faceBack.style.visibility = showFront ? 'hidden' : 'visible';
      faceFront.style.transform = `rotate(${wobble}deg)`;
      faceBack.style.transform = `rotate(${180 + wobble}deg)`;
      frame.setAttribute('data-flip-side', side);
    }
    function updateSide() {
      const showFront = ((Math.floor((rotation + 90) / 180) % 2) + 2) % 2 === 0;
      const next = showFront ? 'front' : 'back';
      if (next !== side) { side = next; opts.onFlip && opts.onFlip(side); }
    }
    function spring(get, set, target, cfg, done) {
      const { stiffness, damping, mass = 1 } = cfg; let v = get(), vv = cfg.velocity || 0, last = null, raf = null;
      if (reduce) { set(target); done && done(); return { cancel() {} }; }
      const STEP = 1 / 240;
      function fr(now) { if (last === null) last = now; let dt = (now - last) / 1000; last = now; if (dt > 1 / 30) dt = 1 / 30;
        let s = dt; while (s > 0) { const h = Math.min(STEP, s); vv += ((-stiffness * (v - target) - damping * vv) / mass) * h; v += vv * h; s -= h; }
        set(v); if (Math.abs(v - target) < 0.05 && Math.abs(vv) < 0.5) { set(target); done && done(); return; } raf = requestAnimationFrame(fr); }
      raf = requestAnimationFrame(fr); return { cancel() { raf && cancelAnimationFrame(raf); } };
    }
    const animRot = (target, cfg, done) => { rotAnim && rotAnim.cancel(); rotAnim = spring(() => rotation, v => { rotation = v; updateSide(); render(); }, target, cfg, done); };
    const animWob = (target, cfg) => { wobAnim && wobAnim.cancel(); if (o.wobbleAmount === 0) { wobble = 0; render(); return; } wobAnim = spring(() => wobble, v => { wobble = v; render(); }, target, cfg); };
    function commit(dir, rv = 0) {
      const target = committed + dir * 180, sp = Math.min(Math.abs(rv), 2500), stiff = 40 + (sp / 2500) * 80;
      if (o.wobbleAmount > 0) { wobble = Math.min(Math.abs(rv) * 0.015, o.wobbleAmount * 1.5) * dir; render(); animWob(0, WOBBLE_SETTLE); }
      animRot(target, { ...FLIP_SPRING, stiffness: stiff, velocity: rv * 0.08 }, () => { committed = target; });
    }
    function onDown(e) {
      if (dragging) return; dragging = true; pid = e.pointerId; e.currentTarget.setPointerCapture?.(pid);
      rotAnim && rotAnim.cancel(); wobAnim && wobAnim.cancel();
      fromTop = e.currentTarget.getAttribute('data-flip-grip') === 'top';
      startX = lastX = e.clientX; lastT = e.timeStamp; vel = 0; e.preventDefault();
    }
    function onMove(e) {
      if (!dragging || e.pointerId !== pid) return;
      const dt = e.timeStamp - lastT; if (dt > 0) vel = ((e.clientX - lastX) / dt) * 1000; lastX = e.clientX; lastT = e.timeStamp;
      const mult = fromTop ? 1 : -1, raw = (e.clientX - startX) * o.rotationDamping * mult;
      rotation = committed + Math.max(-o.maxDragRotation, Math.min(o.maxDragRotation, raw));
      if (o.wobbleAmount > 0) wobble = Math.max(-o.wobbleAmount, Math.min(o.wobbleAmount, raw * 0.15));
      updateSide(); render();
    }
    function onUp(e) {
      if (!dragging || e.pointerId !== pid) return; dragging = false;
      const mult = fromTop ? 1 : -1, adjV = vel * mult, delta = rotation - committed;
      if (Math.abs(adjV) > o.velocityThreshold || Math.abs(delta) > o.commitAngle) commit(adjV > 0 || delta > 0 ? 1 : -1, adjV);
      else { animRot(committed, SNAPBACK_SPRING); if (o.wobbleAmount > 0) animWob(0, WOBBLE_SNAP); }
    }
    grips.forEach(g => { g.addEventListener('pointerdown', onDown); g.addEventListener('pointermove', onMove); g.addEventListener('pointerup', onUp); g.addEventListener('pointercancel', onUp); });
    return { toggle() { commit(1); }, get side() { return side; } };
  }

  // ═══ calendar star engine ════════════════════════════════════════════════════
  const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const mod = (n, m) => ((n % m) + m) % m;
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const smooth = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
  const fmtHour = (h) => `${(h % 12) || 12} ${h < 12 ? 'AM' : 'PM'}`;
  const dayArc = (h) => 0.5 - 0.5 * Math.cos((h / 24) * 6.2832);
  const MS_DAY = 86400000, EPOCH = new Date(1970, 0, 1).getTime();
  const dayIndexOf = (d) => Math.round((d.getTime() - EPOCH) / MS_DAY);
  const dateOfDay = (idx) => new Date(EPOCH + Math.floor(idx) * MS_DAY + MS_DAY / 2);
  const _now = new Date();
  const TODAY = new Date(_now.getFullYear(), _now.getMonth(), _now.getDate());
  const TODAY_DAY = dayIndexOf(TODAY), TODAY_Y = TODAY.getFullYear(), TODAY_M = TODAY.getMonth();

  const CFG = { ppdMin: 0.02, ppdMax: 2600, nightMin: 0.5, sizeSkew: 2.4,
    friction: 0.945, stopBelow: 0.02, velSmoothing: 0.6, focusEase: 0.09, hitRadius: 24, lens: true, lensVignette: 0.32 };

  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d', { alpha: false });

  let W = 0, H = 0, dpr = 1, LAND_PPD = 100, hphMax = 80, lensR = 240;
  let ppd = 100, camDay = TODAY_DAY + 0.5, camHour = 13, vDay = 0, vHour = 0;
  let DEFAULT_DAY = TODAY_DAY + 0.5, DEFAULT_HOUR = 13;
  function initFrame() {
    const fill = 0.9; LAND_PPD = (2 * lensR * fill) / 5; hphMax = (2 * lensR * fill) / 12;
    const dow = TODAY.getDay(); let monday = TODAY_DAY - ((dow + 6) % 7); if (dow === 0 || dow === 6) monday += 7;
    DEFAULT_DAY = monday + 2 + 0.5; DEFAULT_HOUR = 13; ppd = LAND_PPD; camDay = DEFAULT_DAY; camHour = DEFAULT_HOUR;
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2); const first = (W === 0);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    lensR = clamp(Math.min(W, H) * 0.34, 150, 300); if (first) initFrame();
  }
  window.addEventListener('resize', resize); resize();

  const sxOf = (d) => (d - camDay) * ppd + W / 2;
  const hphOf = (p) => clamp(hphMax * Math.pow(p / LAND_PPD, 0.45), 12, hphMax * 1.02);
  function edge(x, y) { const ex = (x - W / 2) / (W * 0.64), ey = (y - H / 2) / (H * 0.7); return clamp(1 - (ex * ex + ey * ey) * 0.9, 0.3, 1); }
  function seedFor(a, b, c) { let h = (a * 374761393 + b * 668265263 + c * 2246822519) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return (h ^ (h >>> 16)) >>> 0; }
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function dayNightColor(hour, a) { const b = dayArc(hour); return `rgba(${Math.round(lerp(165,255,b))},${Math.round(lerp(190,252,b))},${Math.round(lerp(255,238,b))},${a})`; }
  function seasonColor(m, a) { const w = 0.5 + 0.5 * Math.cos(((m - 6) / 12) * 6.2832); return `rgba(${Math.round(lerp(180,255,w))},${Math.round(lerp(202,244,w))},${Math.round(lerp(255,224,w))},${a})`; }
  const GOLD = (a) => `rgba(255,214,150,${a})`, SEL = (a) => `rgba(140,215,255,${a})`, SEL_RING = 'rgba(160,222,255,0.9)';
  const dot = (x, y, r, s) => { ctx.fillStyle = s; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); };
  const ringAt = (x, y, r, s) => { ctx.strokeStyle = s; ctx.lineWidth = 1.25; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.stroke(); };

  let hits = [], lensLabels = [], lensCols = new Map();
  function pushHit(x, y, text, cd, ch) { if (x > -20 && x < W + 20 && y > -20 && y < H + 20) hits.push({ x, y, text, cd, ch }); }
  const inLens = (x, y) => CFG.lens && Math.hypot(x - W / 2, y - H / 2) <= lensR - 6;

  function drawHours(alpha, dom) {
    if (alpha < 0.03) return;
    const hph = hphOf(ppd);
    const dl = Math.floor(camDay - (W / 2) / ppd) - 1, dr = Math.ceil(camDay + (W / 2) / ppd) + 1;
    const hb = Math.floor(camHour - (H / 2) / hph) - 1, ht = Math.ceil(camHour + (H / 2) / hph) + 1;
    const sizeK = clamp(hph / hphMax, 0.45, 1.15), drawThread = ppd > 26;
    for (let d = dl; d <= dr; d++) {
      const X0 = sxOf(d + 0.5); if (X0 < -40 || X0 > W + 40) continue;
      const date = dateOfDay(d), wd = date.getDay(), today = (d === TODAY_DAY);
      if (today) { const w = Math.min(ppd, 260) * 0.5; const g = ctx.createLinearGradient(X0 - w, 0, X0 + w, 0); g.addColorStop(0, 'rgba(255,220,170,0)'); g.addColorStop(0.5, `rgba(255,220,170,${0.11 * alpha})`); g.addColorStop(1, 'rgba(255,220,170,0)'); ctx.fillStyle = g; ctx.fillRect(X0 - w, 0, 2 * w, H); }
      if (drawThread) {
        ctx.strokeStyle = today ? `rgba(255,225,180,${0.34 * alpha})` : (wd === 0 || wd === 6) ? `rgba(150,170,210,${0.07 * alpha})` : `rgba(210,220,245,${0.13 * alpha})`;
        ctx.lineWidth = 1; ctx.beginPath();
        for (let hh = hb, first = true; hh <= ht; hh++) { const hour = mod(hh, 24), rnd = mulberry32(seedFor(d, hour, 7)); const jx = (rnd() - 0.5) * Math.min(ppd, 90) * 0.14; const X = X0 + jx, Y = H / 2 - (hh - camHour) * hph; if (first) { ctx.moveTo(X, Y); first = false; } else ctx.lineTo(X, Y); }
        ctx.stroke();
      }
      for (let hh = hb; hh <= ht; hh++) {
        const hour = mod(hh, 24), rnd = mulberry32(seedFor(d, hour, 7));
        const jx = (rnd() - 0.5) * Math.min(ppd, 90) * 0.14, t = Math.pow(rnd(), CFG.sizeSkew);
        const X = X0 + jx, Y = H / 2 - (hh - camHour) * hph;
        if (X < -12 || X > W + 12 || Y < -12 || Y > H + 12) continue;
        const a = alpha * (0.5 + 0.5 * t) * (CFG.nightMin + (1 - CFG.nightMin) * dayArc(hour)) * edge(X, Y), rr = (1.3 + t * 2.5) * sizeK;
        if (isSel(d, hour)) { dot(X, Y, rr * 1.15, SEL(Math.min(1, a * 1.7 + 0.25))); ringAt(X, Y, rr + 4, SEL_RING); }
        else dot(X, Y, rr, dayNightColor(hour, a));
        if (dom) pushHit(X, Y, `${WD[wd]}, ${MON[date.getMonth()]} ${date.getDate()}, ${date.getFullYear()} · ${fmtHour(hour)}`, d + 0.5, hour);
        if (dom && inLens(X, Y)) { lensLabels.push({ x: X, y: Y, text: fmtHour(hour) }); lensCols.set(d, date); }
      }
    }
  }
  function drawScatter(alpha, dom, iter) {
    if (alpha < 0.03) return;
    iter((cd, seed, colorFn, text, curGold, sizeMul) => {
      const rnd = mulberry32(seed), t = Math.pow(rnd(), CFG.sizeSkew);
      const X = sxOf(cd), Y = H / 2 + (rnd() - 0.5) * H * 0.66; if (X < -12 || X > W + 12) return null;
      const a = alpha * (0.55 + 0.45 * t) * edge(X, Y);
      dot(X, Y, (1.7 + t * 2.2) * (sizeMul || 1) * (0.75 + 0.25 * alpha), curGold ? GOLD(a) : colorFn(a, t));
      if (dom) pushHit(X, Y, text, cd, null);
      if (dom && inLens(X, Y)) lensLabels.push({ x: X, y: Y, text });
      return { X, Y, t };
    });
  }
  function drawDays(alpha, dom) {
    drawScatter(alpha, dom, (place) => {
      const dl = Math.floor(camDay - (W / 2) / ppd) - 1, dr = Math.ceil(camDay + (W / 2) / ppd) + 1; if (dr - dl > 4000) return;
      for (let d = dl; d <= dr; d++) { const date = dateOfDay(d), wknd = (date.getDay() === 0 || date.getDay() === 6);
        const rp = place(d + 0.5, seedFor(d, 0, 11), (a) => wknd ? `rgba(190,205,240,${a * 0.85})` : `rgba(236,240,255,${a})`, `${WD[date.getDay()]}, ${MON[date.getMonth()]} ${date.getDate()}, ${date.getFullYear()}`, d === TODAY_DAY, 1);
        if (rp && dayCount.has(d)) ringAt(rp.X, rp.Y, 9, SEL_RING); }
    });
  }
  function drawMonths(alpha, dom) {
    drawScatter(alpha, dom, (place) => {
      const dl = Math.floor(camDay - (W / 2) / ppd) - 40, dr = Math.ceil(camDay + (W / 2) / ppd) + 40;
      let am0 = (() => { const d = dateOfDay(dl); return d.getFullYear() * 12 + d.getMonth() - 1; })(), am1 = (() => { const d = dateOfDay(dr); return d.getFullYear() * 12 + d.getMonth() + 1; })();
      if (am1 - am0 > 3000) return;
      for (let am = am0; am <= am1; am++) { const y = Math.floor(am / 12), m = mod(am, 12), cd = dayIndexOf(new Date(y, m, 15)); place(cd, seedFor(am, 0, 17), (a) => seasonColor(m, a), `${MONTHS[m]} ${y}`, (y === TODAY_Y && m === TODAY_M), 1.05); }
    });
  }
  function drawYears(alpha, dom, decAmt) {
    if (alpha < 0.03) return;
    const dl = Math.floor(camDay - (W / 2) / ppd) - 400, dr = Math.ceil(camDay + (W / 2) / ppd) + 400;
    const yL = dateOfDay(dl).getFullYear() - 1, yR = dateOfDay(dr).getFullYear() + 1; if (yR - yL > 3000) return;
    const pos = (Y) => { const cd = dayIndexOf(new Date(Y, 6, 2)), rnd = mulberry32(seedFor(Y, 0, 19)), t = Math.pow(rnd(), CFG.sizeSkew); return { X: sxOf(cd), Y: H / 2 + (rnd() - 0.5) * (H * 0.28 + H * 0.34 * decAmt), t, cd }; };
    if (decAmt > 0.01) { ctx.strokeStyle = `rgba(150,180,240,${0.4 * decAmt * alpha})`; ctx.lineWidth = 1; for (let Y = yL; Y <= yR; Y++) { if (Math.floor((Y - 1) / 10) !== Math.floor(Y / 10)) continue; const a = pos(Y - 1), b = pos(Y); ctx.beginPath(); ctx.moveTo(a.X, a.Y); ctx.lineTo(b.X, b.Y); ctx.stroke(); } }
    for (let Y = yL; Y <= yR; Y++) { const p = pos(Y); if (p.X < -12 || p.X > W + 12) continue; const a = alpha * (0.55 + 0.45 * p.t) * edge(p.X, p.Y); dot(p.X, p.Y, (1.7 + p.t * 2.3) * (0.75 + 0.25 * alpha), Y === TODAY_Y ? GOLD(a) : `rgba(228,234,255,${a})`); if (dom) pushHit(p.X, p.Y, `${Y}`, p.cd, null); if (dom && inLens(p.X, p.Y)) lensLabels.push({ x: p.X, y: p.Y, text: `${Y}` }); }
  }
  function drawLens(domName) {
    const cx = W / 2, cy = H / 2;
    if (CFG.lensVignette > 0) { const g = ctx.createRadialGradient(cx, cy, lensR * 0.72, cx, cy, Math.max(W, H) * 0.72); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${CFG.lensVignette})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
    ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx, cy, lensR, 0, 6.2832); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.beginPath(); ctx.moveTo(cx - 6, cy); ctx.lineTo(cx + 6, cy); ctx.moveTo(cx, cy - 6); ctx.lineTo(cx, cy + 6); ctx.stroke();
    const c = dateOfDay(camDay); let cap;
    if (domName === 'hours' || domName === 'days') cap = `${MONTHS[c.getMonth()]} ${c.getFullYear()}`; else if (domName === 'months') cap = `${c.getFullYear()}`; else cap = `${Math.floor(c.getFullYear() / 10) * 10}s`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.font = '600 13px ui-sans-serif, system-ui, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillText(cap, cx, cy - lensR - 12);
    if (domName === 'hours') { ctx.font = '11px ui-monospace, Menlo, monospace'; for (const [d, date] of lensCols) { const colX = sxOf(d + 0.5), dx = colX - cx; if (Math.abs(dx) > lensR - 14) continue; const yIn = Math.sqrt(Math.max(0, lensR * lensR - dx * dx)); ctx.fillStyle = d === TODAY_DAY ? 'rgba(255,225,180,0.95)' : 'rgba(255,255,255,0.7)'; ctx.fillText(`${WD[date.getDay()]} ${date.getDate()}`, colX, cy - yIn + 15); } }
    ctx.textAlign = 'left'; ctx.font = '10px ui-monospace, Menlo, monospace'; ctx.fillStyle = 'rgba(255,255,255,0.55)'; for (const L of lensLabels) ctx.fillText(L.text, L.x + 6, L.y + 0.5);
  }

  // ═══ selection ═══════════════════════════════════════════════════════════════
  const selection = new Set(), dayCount = new Map();
  const kOf = (d, h) => d + '_' + h, isSel = (d, h) => selection.has(kOf(d, h));
  function addSel(d, h) { const k = kOf(d, h); if (!selection.has(k)) { selection.add(k); dayCount.set(d, (dayCount.get(d) || 0) + 1); } }
  function delSel(d, h) { if (selection.delete(kOf(d, h))) { const c = (dayCount.get(d) || 1) - 1; c <= 0 ? dayCount.delete(d) : dayCount.set(d, c); } }
  function toggleSel(d, h) { isSel(d, h) ? delSel(d, h) : addSel(d, h); refreshSel(); }
  function clearSel() { selection.clear(); dayCount.clear(); refreshSel(); }

  const nav = { on: false, day: 0, hour: 13, useH: false, ppd: 0, useP: false };
  function flyTo(day, ppdT, hour) { nav.on = true; nav.day = day; nav.ppd = ppdT; nav.useP = ppdT != null; nav.useH = hour != null; nav.hour = hour != null ? hour : camHour; vDay = 0; vHour = 0; }
  const goHome = () => flyTo(DEFAULT_DAY, LAND_PPD, DEFAULT_HOUR);

  let ring = null;
  const pickNearest = (px, py) => { let b = null, bd = CFG.hitRadius; for (const s of hits) { const d = Math.hypot(s.x - px, s.y - py); if (d < bd) { bd = d; b = s; } } return b; };
  const marq = { on: false, x0: 0, y0: 0, x1: 0, y1: 0 };
  function applyMarquee() {
    const xL = Math.min(marq.x0, marq.x1), xR = Math.max(marq.x0, marq.x1), yT = Math.min(marq.y0, marq.y1), yB = Math.max(marq.y0, marq.y1);
    if (xR - xL < 6 && yB - yT < 6) { const s = pickNearest(marq.x1, marq.y1); if (s && s.ch != null) toggleSel(Math.floor(s.cd), s.ch); return; }
    const hph = hphOf(ppd);
    const dA = Math.ceil((camDay + (xL - W / 2) / ppd) - 0.5), dB = Math.floor((camDay + (xR - W / 2) / ppd) - 0.5);
    const hHigh = camHour + (H / 2 - yT) / hph, hLow = camHour + (H / 2 - yB) / hph, hA = Math.floor(hLow), hB = Math.ceil(hHigh), allHrs = (hB - hA) >= 24;
    let added = 0;
    for (let d = dA; d <= dB && added < 900; d++) { if (allHrs) { for (let h = 0; h < 24; h++) { addSel(d, h); added++; } } else for (let hh = hA; hh <= hB && added < 900; hh++) { addSel(d, mod(hh, 24)); added++; } }
    refreshSel();
  }

  function draw(now) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); hits = []; lensLabels = []; lensCols.clear();
    const aHours = smooth((ppd - 7) / (16 - 7)), aDays = clamp(smooth((ppd - 1.2) / 1.8) - smooth((ppd - 9) / 7), 0, 1),
          aMonths = clamp(smooth((ppd - 0.12) / 0.18) - smooth((ppd - 1.1) / 1.1), 0, 1), aYears = clamp(1 - smooth((ppd - 0.13) / 0.17), 0, 1);
    const decAmt = smooth((0.45 - ppd) / (0.45 - 0.05));
    const domName = [['hours', aHours], ['days', aDays], ['months', aMonths], ['years', aYears]].slice().sort((a, b) => b[1] - a[1])[0][0];
    drawYears(aYears, domName === 'years', decAmt); drawMonths(aMonths, domName === 'months'); drawDays(aDays, domName === 'days'); drawHours(aHours, domName === 'hours');
    if (CFG.lens) drawLens(domName);
    if (marq.on) { const x = Math.min(marq.x0, marq.x1), y = Math.min(marq.y0, marq.y1), w = Math.abs(marq.x1 - marq.x0), h = Math.abs(marq.y1 - marq.y0); ctx.fillStyle = 'rgba(140,210,255,0.10)'; ctx.fillRect(x, y, w, h); ctx.strokeStyle = 'rgba(150,220,255,0.8)'; ctx.lineWidth = 1.25; ctx.strokeRect(x, y, w, h); }
    if (ring) { const e = (now - ring.start) / 700; if (e >= 1) ring = null; else { const X = sxOf(ring.cd), Y = ring.ch != null ? H / 2 - (ring.ch - camHour) * hphOf(ppd) : ring.sy; ctx.strokeStyle = `rgba(255,255,255,${(1 - e) * 0.55})`; ctx.lineWidth = 1.25; ctx.beginPath(); ctx.arc(X, Y, 8 + e * 42, 0, 6.2832); ctx.stroke(); } }
    return domName;
  }

  // ═══ chrome wiring ═══════════════════════════════════════════════════════════
  const bTitle = document.getElementById('bTitle'), bSub = document.getElementById('bSub');
  const sheet = document.getElementById('sheet'), selCount = document.getElementById('selCount'), selSub = document.getElementById('selSub'),
        plist = document.getElementById('plist'), createBtn = document.getElementById('createBtn');
  let mode = 'nav';

  function refreshSel() {
    const keys = [...selection]; createBtn.disabled = keys.length === 0;
    selCount.textContent = keys.length ? `${keys.length} selected` : 'Select times';
    selSub.textContent = keys.length ? 'tap header to review · Create when ready' : 'tap a star · drag to lasso';
    const byDay = new Map();
    for (const k of keys) { const i = k.indexOf('_'), d = +k.slice(0, i), h = +k.slice(i + 1); if (!byDay.has(d)) byDay.set(d, []); byDay.get(d).push(h); }
    let html = '';
    for (const d of [...byDay.keys()].sort((a, b) => a - b)) { const date = dateOfDay(d); html += `<div class="pday"><div class="pdate">${WD[date.getDay()]}, ${MON[date.getMonth()]} ${date.getDate()}, ${date.getFullYear()}</div><div class="pchips">`; for (const h of byDay.get(d).sort((a, b) => a - b)) html += `<button class="chip" data-d="${d}" data-h="${h}">${fmtHour(h)}</button>`; html += '</div></div>'; }
    plist.innerHTML = html; if (!keys.length) sheet.classList.remove('expanded');
  }
  let toastTimer = 0; const toastEl = document.getElementById('toast');
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1700); }

  document.querySelectorAll('.todayBtn').forEach(b => b.addEventListener('click', goHome));
  createBtn.addEventListener('click', () => { const n = selection.size; if (!n) return; toast(`Created ${n} time${n > 1 ? 's' : ''}`); clearSel(); });
  document.getElementById('sheetHead').addEventListener('click', (e) => { if (e.target.closest('button')) return; if (selection.size) sheet.classList.toggle('expanded'); });
  plist.addEventListener('click', (e) => { const c = e.target.closest('.chip'); if (c) { delSel(+c.dataset.d, +c.dataset.h); refreshSel(); } });

  createFrameFlip(document.getElementById('frame'), { onFlip: (side) => { mode = side === 'back' ? 'select' : 'nav'; if (mode === 'nav') { sheet.classList.remove('expanded'); marq.on = false; } } });

  // ═══ canvas input: pan / pinch / tap / lasso (mode-gated) ═════════════════════
  const pointers = new Map(); let multi = false, dragging = false, downX = 0, downY = 0, lastX = 0, lastY = 0, moved = false, pinch = null;
  function startPinch() {
    const p = [...pointers.values()], dist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), midX = (p[0].x + p[1].x) / 2, midY = (p[0].y + p[1].y) / 2, hph = hphOf(ppd);
    pinch = { startDist: dist, startPpd: ppd, anchorDay: camDay + (midX - W / 2) / ppd, anchorHour: camHour + (H / 2 - midY) / hph };
    vDay = 0; vHour = 0; nav.on = false; dragging = false; marq.on = false;
  }
  function updatePinch() {
    const p = [...pointers.values()]; if (p.length < 2) return;
    const dist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), midX = (p[0].x + p[1].x) / 2, midY = (p[0].y + p[1].y) / 2;
    ppd = clamp(pinch.startPpd * (dist / pinch.startDist), CFG.ppdMin, CFG.ppdMax);
    const hph = hphOf(ppd); camDay = pinch.anchorDay - (midX - W / 2) / ppd; camHour = pinch.anchorHour - (H / 2 - midY) / hph;
  }
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); nav.on = false;
    if (pointers.size >= 2) { multi = true; startPinch(); return; }
    downX = lastX = e.clientX; downY = lastY = e.clientY; moved = false;
    if (mode === 'select') { marq.on = true; marq.x0 = marq.x1 = e.clientX; marq.y0 = marq.y1 = e.clientY; }
    else { dragging = true; vDay = 0; vHour = 0; }
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return; pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pointers.size >= 2) { updatePinch(); return; }
    if (multi) return;
    if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) moved = true;
    if (marq.on) { marq.x1 = e.clientX; marq.y1 = e.clientY; return; }
    if (dragging) { const hph = hphOf(ppd), ddx = e.clientX - lastX, ddy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY; camDay -= ddx / ppd; camHour += ddy / hph; vDay = CFG.velSmoothing * vDay + (1 - CFG.velSmoothing) * (-ddx / ppd); vHour = CFG.velSmoothing * vHour + (1 - CFG.velSmoothing) * (ddy / hph); }
  });
  function endPointer(e) {
    const had = pointers.has(e.pointerId); pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 0) {
      if (!multi && had) {
        if (marq.on) { marq.on = false; applyMarquee(); }
        else if (!moved) { const s = pickNearest(e.clientX, e.clientY); if (s) { if (mode === 'select' && s.ch != null) { toggleSel(Math.floor(s.cd), s.ch); ring = { cd: s.cd, ch: s.ch, sy: s.y, start: performance.now() }; } else if (s.ch == null) flyTo(s.cd, LAND_PPD, DEFAULT_HOUR); } }
      }
      dragging = false; marq.on = false; multi = false;
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault(); nav.on = false;
    if (e.metaKey || e.ctrlKey) { const h0 = hphOf(ppd), du = camDay + (e.clientX - W / 2) / ppd, hu = camHour + (H / 2 - e.clientY) / h0; ppd = clamp(ppd * Math.exp(-e.deltaY * 0.0016), CFG.ppdMin, CFG.ppdMax); const h1 = hphOf(ppd); camDay = du - (e.clientX - W / 2) / ppd; camHour = hu - (H / 2 - e.clientY) / h1; }
    else { const hph = hphOf(ppd); camDay += e.deltaX / ppd; camHour -= e.deltaY / hph; vDay = 0; vHour = 0; }
  }, { passive: false });

  let lastL = '';
  function updateReadout(domName) {
    const c = dateOfDay(camDay); let l1;
    if (domName === 'hours' || domName === 'days') l1 = `${WD[c.getDay()]}, ${MON[c.getMonth()]} ${c.getDate()}, ${c.getFullYear()}`;
    else if (domName === 'months') l1 = `${MONTHS[c.getMonth()]} ${c.getFullYear()}`;
    else l1 = `${Math.floor(c.getFullYear() / 10) * 10}s`;
    const across = W / ppd; let s;
    if (across < 2.5) s = 'one day'; else if (across < 20) s = `${Math.round(across)} days`; else if (across < 130) s = `${Math.round(across / 7)} weeks`; else if (across < 1100) s = `${Math.round(across / 30.4)} months`; else if (across < 20000) s = `${Math.round(across / 365)} years`; else s = `${Math.round(across / 3652)} decades`;
    if (l1 !== lastL) { bTitle.textContent = l1; lastL = l1; }
    bSub.textContent = s + ' in view';
  }

  let lastT = performance.now();
  function frame(t) {
    const dt = Math.min((t - lastT) / 16.6667, 3); lastT = t;
    if (nav.on) {
      camDay += (nav.day - camDay) * CFG.focusEase * dt; if (nav.useH) camHour += (nav.hour - camHour) * CFG.focusEase * dt;
      if (nav.useP) { const lp = Math.log(ppd); ppd = Math.exp(lp + (Math.log(nav.ppd) - lp) * CFG.focusEase * dt); }
      if (Math.abs(nav.day - camDay) < 0.01 && (!nav.useP || Math.abs(Math.log(ppd / nav.ppd)) < 0.01)) { camDay = nav.day; if (nav.useP) ppd = nav.ppd; if (nav.useH) camHour = nav.hour; nav.on = false; }
    } else if (!dragging && !pinch && !marq.on) {
      camDay += vDay * dt; camHour += vHour * dt; const decay = Math.pow(CFG.friction, dt); vDay *= decay; vHour *= decay;
      if (Math.abs(vDay) < CFG.stopBelow / ppd) vDay = 0; if (Math.abs(vHour) < CFG.stopBelow) vHour = 0;
    }
    const domName = draw(t); updateReadout(domName);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  refreshSel();
})();
</script>
</body>
